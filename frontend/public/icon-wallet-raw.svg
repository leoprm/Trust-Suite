<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0D0D1A"/>

  <!-- Wallet body -->
  <rect x="110" y="160" width="292" height="192" rx="24" fill="none" stroke="#f59e0b" stroke-width="18"/>

  <!-- Wallet flap -->
  <path d="M110 220 Q256 120 402 220" fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="round"/>

  <!-- Card peek 1 -->
  <rect x="140" y="230" width="160" height="80" rx="12" fill="none" stroke="#f59e0b" stroke-width="10" opacity="0.6"/>

  <!-- Card peek 2 (shifted) -->
  <rect x="155" y="245" width="160" height="80" rx="12" fill="none" stroke="#f59e0b" stroke-width="10" opacity="0.4"/>

  <!-- Coin circle -->
  <circle cx="370" cy="260" r="28" fill="none" stroke="#fbbf24" stroke-width="12"/>

  <!-- Currency symbol inside coin (simplified) -->
  <text x="370" y="270" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="28" font-weight="bold">$</text>
</svg>
