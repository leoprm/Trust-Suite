<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#10111f"/>

  <!-- Radar dish outer ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#6366f1" stroke-width="10"/>

  <!-- Inner range ring 1 -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#6366f1" stroke-width="5" stroke-opacity="0.5"/>

  <!-- Inner range ring 2 -->
  <circle cx="256" cy="256" r="65" fill="none" stroke="#6366f1" stroke-width="5" stroke-opacity="0.5"/>

  <!-- Horizontal crosshair -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#6366f1" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Vertical crosshair -->
  <line x1="256" y1="80" x2="256" y2="432" stroke="#6366f1" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Radar sweep wedge: from top (0°) clockwise ~70° -->
  <path d="M 256 256 L 256 86 A 170 170 0 0 1 397 205 Z"
        fill="#6366f1" fill-opacity="0.25"/>

  <!-- Sweep leading edge line (bright) -->
  <line x1="256" y1="256" x2="397" y2="205" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>

  <!-- Target "blip" - detected insight point -->
  <circle cx="310" cy="160" r="14" fill="none" stroke="#6366f1" stroke-width="6"/>
  <circle cx="310" cy="160" r="4" fill="#6366f1"/>

  <!-- Secondary blip -->
  <circle cx="200" cy="320" r="10" fill="none" stroke="#6366f1" stroke-width="5"/>
  <circle cx="200" cy="320" r="3" fill="#6366f1"/>

  <!-- Center hub -->
  <circle cx="256" cy="256" r="10" fill="#6366f1"/>
</svg>